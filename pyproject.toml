[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-risk-ml"
version = "1.0.0"
description = "End-to-End Credit Risk ML & MLOps Platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Lead ML Engineer" }
]
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.1",
    "sqlalchemy>=2.0.25",
    "psycopg2-binary>=2.9.9",
    "pandas>=2.2.0",
    "numpy>=1.26.3",
    "scikit-learn>=1.4.0",
    "torch>=2.2.0",
    "mlflow>=2.10.0",
    "pandera>=0.18.0",
    "matplotlib>=3.8.2",
    "scipy>=1.11.0",
    "joblib>=1.3.0",
    "alembic>=1.13.0",
    "seaborn>=0.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.26.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
pythonpath = ["."]
